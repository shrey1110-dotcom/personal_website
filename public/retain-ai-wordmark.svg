<!-- Wordmark for RETAIN AI. Dark art on transparency so it sits on the light
     logo plate used across the experience section, matching how the Rezolve.ai
     mark is supplied. Replaces an earlier asset whose letter paths spelled
     "REELEDIS". -->
<svg width="420" height="128" viewBox="0 0 420 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RETAIN AI">
  <circle cx="30" cy="64" r="10" fill="#4f46e5"/>
  <circle cx="30" cy="64" r="19" fill="#4f46e5" fill-opacity="0.18"/>
  <text x="58" y="64"
        dominant-baseline="central"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="50"
        font-weight="700"
        letter-spacing="2"
        fill="#0b1120">RETAIN<tspan dx="16" fill="#4f46e5">AI</tspan></text>
</svg>
